specVersion: '3.0'
metadata:
  name: openui5-hello-world
type: application
framework:
  name: OpenUI5
  version: "1.139.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: ui5-middleware-proxy
      afterMiddleware: compression
      configuration:
        baseUri: "/odata"
        proxyUri: "http://localhost:4004/odata"
